name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate sitemap and page metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const xml=fs.readFileSync('sitemap.xml','utf8');
          const urls=[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim());
          if(urls.length!==72) throw new Error(`Expected 72 sitemap URLs, got ${urls.length}`);
          if(new Set(urls).size!==urls.length) throw new Error('Duplicate sitemap URLs');
          if(urls.some(u=>!u.startsWith('https://solobizkit.it.com/'))) throw new Error('Non-canonical sitemap host');

          function walk(dir){
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(entry=>{
              if(['.git','node_modules'].includes(entry.name)) return [];
              const full=path.join(dir,entry.name);
              return entry.isDirectory()?walk(full):[full];
            });
          }

          const files=walk('.').filter(f=>f==='index.html'||f.endsWith(`${path.sep}index.html`));
          const routes=files.map(f=>f==='index.html'?'/':`/${path.dirname(f).split(path.sep).join('/')}/`);
          const sitemapPaths=new Set(urls.map(u=>new URL(u).pathname));
          const routeSet=new Set(routes);
          const omitted=[...routeSet].filter(r=>!sitemapPaths.has(r));
          const missing=[...sitemapPaths].filter(r=>!routeSet.has(r));
          if(omitted.length) throw new Error(`HTML routes missing from sitemap: ${omitted.join(', ')}`);
          if(missing.length) throw new Error(`Sitemap routes missing HTML: ${missing.join(', ')}`);

          for(const file of files){
            const html=fs.readFileSync(file,'utf8');
            const route=file==='index.html'?'/':`/${path.dirname(file).split(path.sep).join('/')}/`;
            const title=html.match(/<title>([^<]+)<\/title>/i)?.[1]?.trim()||'';
            const description=html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i)?.[1]?.trim()||'';
            const canonical=html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i)?.[1]?.trim()||'';
            const h1=(html.match(/<h1\b/gi)||[]).length;
            if(!title) throw new Error(`${route} has no title`);
            if(!description) throw new Error(`${route} has no meta description`);
            if(!canonical) throw new Error(`${route} has no canonical`);
            const expected=`https://solobizkit.it.com${route}`;
            if(canonical!==expected) throw new Error(`${route} canonical ${canonical}, expected ${expected}`);
            if(h1!==1) throw new Error(`${route} has ${h1} H1 elements`);
          }

          for(const required of ['favicon.svg','favicon.ico','manifest.webmanifest','robots.txt','ads.txt']){
            if(!fs.existsSync(required)) throw new Error(`Missing ${required}`);
          }

          const ads=fs.readFileSync('ads.txt','utf8');
          if(!/google\.com\s*,\s*pub-9212084765206199\s*,\s*DIRECT\s*,\s*f08c47fec0942fa0/i.test(ads)){
            throw new Error('ads.txt publisher line is incorrect');
          }

          console.log(`Verified ${files.length} HTML routes and ${urls.length} sitemap URLs.`);
          NODE
