name: Temporary SoloBizKit post-deploy verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for static deployment
        run: sleep 45
      - name: Verify live deployment
        run: |
          set -e
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://solobizkit.it.com/favicon.ico)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://solobizkit.it.com/manifest.webmanifest)" = "200"
          curl -fsS https://solobizkit.it.com/manifest.webmanifest | grep -q 'SoloBizKit'
          curl -fsS https://solobizkit.it.com/sitemap.xml > /tmp/sitemap.xml
          test "$(grep -c '<loc>' /tmp/sitemap.xml)" = "72"
          curl -fsS https://solobizkit.it.com/ > /tmp/home.html
          grep -q '<h1' /tmp/home.html
          grep -q 'https://solobizkit.it.com/' /tmp/home.html
          curl -fsS https://solobizkit.it.com/compress-pdf/ > /tmp/compress.html
          grep -q '<h1' /tmp/compress.html
      - name: Verify representative pages in Chrome
        run: |
          npm install --no-save playwright-core@1.55.0
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          for(const pathname of ['/','/compress-pdf/','/qr-code-generator/']){
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(`https://solobizkit.it.com${pathname}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(800);
            const state=await page.evaluate(()=>({h1:document.querySelectorAll('h1').length,w:document.documentElement.clientWidth,scroll:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)}));
            if(response?.status()!==200) throw new Error(`${pathname} HTTP ${response?.status()}`);
            if(state.h1!==1) throw new Error(`${pathname} H1 ${state.h1}`);
            if(state.scroll>state.w+1) throw new Error(`${pathname} mobile overflow ${state.scroll-state.w}px`);
            if(errors.length) throw new Error(`${pathname} page errors: ${errors.join(' | ')}`);
            await ctx.close();
          }
          await browser.close();
          NODE
