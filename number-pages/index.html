<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number PDF Pages Free | SoloBizKit</title><meta name="description" content="Add page numbers to every page of a PDF and download a new copy. Free, no sign up."><link rel="canonical" href="https://solobizkit.it.com/number-pages/"><link rel="stylesheet" href="/global-shell.css"><link rel="stylesheet" href="/theme-warm-green.css"><link rel="stylesheet" href="/pdf-suite.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><header class="sbk-global-header"><div class="sbk-global-nav"><a class="sbk-global-brand" href="/">SoloBiz<span>Kit</span></a><nav class="sbk-global-links"><a href="/pdf-tools/">PDF Tools</a></nav></div></header><main><section class="pdf-hero"><div class="pdf-wrap"><div class="eyebrow">PDF organizer</div><h1>Number PDF Pages</h1><p>Add clean page numbers to every page of a PDF.</p></div></section><section class="pdf-wrap pdf-work"><div class="pdf-panel"><div class="pdf-drop"><div class="pdf-drop-icon">#</div><h2>Choose a PDF</h2><input id="file" type="file" accept="application/pdf,.pdf" hidden><button class="pdf-btn primary" id="choose">Choose PDF</button></div><div class="pdf-controls"><div class="pdf-field"><label>Position</label><select id="position"><option value="bottom-center">Bottom center</option><option value="bottom-right">Bottom right</option><option value="top-right">Top right</option><option value="top-center">Top center</option></select></div><div class="pdf-field"><label>Start number</label><input id="start" type="number" min="1" value="1"></div></div><button class="pdf-btn primary" id="run" disabled>Add page numbers</button><div class="pdf-status" id="status">Choose a PDF to begin.</div></div><aside class="pdf-panel"><h2>Simple numbering</h2><p class="pdf-muted">Adds one number to each page using a clean standard font.</p><div class="pdf-note"><strong>Privacy:</strong> processing runs in your browser.</div></aside></section></main><script>const $=x=>document.getElementById(x),file=$('file'),run=$('run'),status=$('status');let doc=null,name='document.pdf';$('choose').onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>100*1024*1024){status.textContent='File exceeds the 100 MB limit.';return}try{doc=await PDFLib.PDFDocument.load(await f.arrayBuffer());name=f.name;run.disabled=false;status.textContent=f.name+' · '+doc.getPageCount()+' pages'}catch(e){doc=null;run.disabled=true;status.textContent='Could not open this PDF. It may be password-protected or damaged.'}};run.onclick=async()=>{if(!doc)return;run.disabled=true;status.textContent='Adding page numbers…';try{const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica),start=Math.max(1,+$('start').value||1),pos=$('position').value;doc.getPages().forEach((p,i)=>{const {width,height}=p.getSize(),text=String(start+i),size=11,tw=font.widthOfTextAtSize(text,size);let x=36,y=24;if(pos==='bottom-center')x=(width-tw)/2;else if(pos==='bottom-right')x=width-tw-36;else if(pos==='top-right'){x=width-tw-36;y=height-30}else if(pos==='top-center'){x=(width-tw)/2;y=height-30}p.drawText(text,{x,y,size,font,color:PDFLib.rgb(.25,.28,.25)})});const bytes=await doc.save({useObjectStreams:true}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=name.replace(/\.pdf$/i,'')+'-numbered.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Done · page numbers added.';window.sbkComplete?.('number_pdf_pages',{page_count:doc.getPageCount()})}catch(e){status.textContent='Could not add page numbers.'}finally{run.disabled=!doc}};</script></body></html>
