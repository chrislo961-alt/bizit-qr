<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete PDF Pages Free | SoloBizKit</title><meta name="description" content="Remove unwanted pages from a PDF and download a clean copy. Free browser-based PDF tool."><link rel="canonical" href="https://solobizkit.it.com/delete-pdf-pages/"><link rel="stylesheet" href="/global-shell.css"><link rel="stylesheet" href="/theme-warm-green.css"><link rel="stylesheet" href="/pdf-suite.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><header class="sbk-global-header"><div class="sbk-global-nav"><a class="sbk-global-brand" href="/">SoloBiz<span>Kit</span></a><nav class="sbk-global-links"><a href="/pdf-tools/">PDF Tools</a></nav></div></header><main><section class="pdf-hero"><div class="pdf-wrap"><div class="eyebrow">PDF organizer</div><h1>Delete PDF Pages</h1><p>Remove pages you do not need and download a new PDF.</p></div></section><section class="pdf-wrap pdf-work"><div class="pdf-panel"><div class="pdf-drop"><div class="pdf-drop-icon">−</div><h2>Choose a PDF</h2><input id="file" type="file" accept="application/pdf,.pdf" hidden><button class="pdf-btn primary" id="choose">Choose PDF</button></div><div class="pdf-field"><label>Pages to delete</label><input id="pages" placeholder="Example: 2, 5-7"></div><button class="pdf-btn primary" id="run" disabled>Delete pages</button><div class="pdf-status" id="status">Choose a PDF to begin.</div></div><aside class="pdf-panel"><h2>How to enter pages</h2><p class="pdf-muted">Separate pages with commas and use a hyphen for ranges: <strong>2, 5-7</strong>.</p><div class="pdf-note"><strong>Safety:</strong> the original file is never changed.</div></aside></section></main><script>const $=x=>document.getElementById(x),file=$('file'),run=$('run'),status=$('status');let bytes=null,count=0,name='document.pdf';$('choose').onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>100*1024*1024){status.textContent='File exceeds the 100 MB limit.';return}try{bytes=await f.arrayBuffer();const d=await PDFLib.PDFDocument.load(bytes);count=d.getPageCount();name=f.name;run.disabled=count<2;status.textContent=f.name+' · '+count+' pages'}catch(e){bytes=null;run.disabled=true;status.textContent='Could not open this PDF.'}};function parse(s,max){const set=new Set();for(const part of s.split(',')){const p=part.trim();if(!p)continue;if(p.includes('-')){let[a,b]=p.split('-').map(Number);if(!a||!b)throw 0;if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++){if(i<1||i>max)throw 0;set.add(i)}}else{const n=+p;if(!n||n<1||n>max)throw 0;set.add(n)}}return [...set]}run.onclick=async()=>{try{const remove=parse($('pages').value,count);if(!remove.length){status.textContent='Enter at least one page to delete.';return}if(remove.length>=count){status.textContent='Keep at least one page in the PDF.';return}run.disabled=true;const src=await PDFLib.PDFDocument.load(bytes),keep=src.getPageIndices().filter(i=>!remove.includes(i+1)),out=await PDFLib.PDFDocument.create(),pages=await out.copyPages(src,keep);pages.forEach(p=>out.addPage(p));const data=await out.save({useObjectStreams:true}),url=URL.createObjectURL(new Blob([data],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=name.replace(/\.pdf$/i,'')+'-pages-removed.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Done · '+remove.length+' page'+(remove.length===1?'':'s')+' removed.'}catch(e){status.textContent='Check the page numbers and try again.'}finally{run.disabled=!bytes}};</script></body></html>
