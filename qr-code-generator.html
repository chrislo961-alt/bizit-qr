<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free QR Code Generator | SoloBizKit</title><meta name="description" content="Create a free QR code for any URL or text. No sign up required."><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script></head><body>
<header><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">▣</span>Solo<b>BizKit</b></a><div class="actions"><a class="btn btn-soft" href="index.html">← Home</a></div></div></header>
<main class="container"><section class="page-head"><div class="eyebrow">FREE • PRIVATE • FAST</div><h1>QR Code Generator</h1><p>Create a QR code for a website, text or any other value. Everything happens in your browser.</p></section><section class="tool-shell"><div class="form-grid"><div class="field full"><label for="qrText">URL or text</label><textarea id="qrText" rows="4" placeholder="https://example.com">https://solobizkit.it.com</textarea></div><div class="field"><label for="qrSize">Size</label><select id="qrSize"><option value="220">220 × 220</option><option value="320">320 × 320</option><option value="480">480 × 480</option></select></div><div class="field"><label>&nbsp;</label><button class="btn btn-primary" id="generateQr">Generate QR Code</button></div></div><div class="result qr-wrap"><h3>Your QR code</h3><canvas id="qrCanvas"></canvas><div><button class="btn btn-soft" id="downloadQr">Download PNG</button></div></div><p class="note">Tip: scan your QR code before publishing it. This tool does not upload the entered text to SoloBizKit.</p></section></main>
<script>const txt=document.getElementById('qrText'),size=document.getElementById('qrSize'),canvas=document.getElementById('qrCanvas');function make(){QRcode=window.QRCode;QRcode.toCanvas(canvas,txt.value||' ',{width:+size.value,margin:2,errorCorrectionLevel:'M'},e=>{if(e)alert('Could not generate QR code.');});}document.getElementById('generateQr').onclick=make;document.getElementById('downloadQr').onclick=()=>{const a=document.createElement('a');a.download='solobizkit-qr.png';a.href=canvas.toDataURL('image/png');a.click()};make();</script></body></html>
