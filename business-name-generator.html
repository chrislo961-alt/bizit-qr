<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Business Name Generator | SoloBizKit</title><meta name="description" content="Generate free business name ideas by industry and style."><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">▣</span>Solo<b>BizKit</b></a><div class="actions"><a class="btn btn-soft" href="index.html">← Home</a></div></div></header>
<main class="container"><section class="page-head"><div class="eyebrow">FREE • NO SIGN UP</div><h1>Business Name Generator</h1><p>Generate memorable business-name ideas based on your keyword, industry and preferred style.</p></section><section class="tool-shell"><div class="form-grid"><div class="field"><label for="keyword">Keyword</label><input id="keyword" placeholder="e.g. coffee, design, fitness"></div><div class="field"><label for="industry">Industry</label><select id="industry"><option>General</option><option>Technology</option><option>Consulting</option><option>Fitness</option><option>Food</option><option>Creative</option><option>Finance</option></select></div><div class="field"><label for="style">Style</label><select id="style"><option value="modern">Modern</option><option value="premium">Premium</option><option value="playful">Playful</option><option value="minimal">Minimal</option></select></div><div class="field"><label>&nbsp;</label><button class="btn btn-primary" id="genNames">Generate names</button></div></div><div class="result"><h3>Name ideas</h3><div id="names" class="result-list"></div><p class="note">Always check trademarks and domain availability before using a business name commercially.</p></div></section></main>
<script>const banks={modern:['Nova','Flow','Spark','Pilot','Nexa','Loop','Mint','Scale'],premium:['Crest','Sterling','Summit','Prime','Atlas','Monarch','Vantage','Noble'],playful:['Pop','Buzzy','Happy','Zippy','Moxie','Sunny','Jolly','Pep'],minimal:['One','Core','Form','North','Base','Line','Plain','Mono']};const ends=['Labs','Works','Co','Studio','HQ','Collective','Group','Kit','House','ly'];function cap(s){return s?s[0].toUpperCase()+s.slice(1).toLowerCase():''}function generate(){const k=cap(document.getElementById('keyword').value.trim())||'Biz',style=document.getElementById('style').value,p=banks[style],out=[];while(out.length<10){const a=p[Math.floor(Math.random()*p.length)],b=ends[Math.floor(Math.random()*ends.length)],variants=[`${k}${a}`,`${a}${k}`,`${k} ${b}`,`${a} ${b}`,`${k}${b}`,`${a}${k}${b}`];const n=variants[Math.floor(Math.random()*variants.length)];if(!out.includes(n))out.push(n)}document.getElementById('names').innerHTML=out.map(n=>`<div class="name-chip">${n}</div>`).join('')}document.getElementById('genNames').onclick=generate;generate();</script></body></html>
