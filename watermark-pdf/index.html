<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watermark PDF Free | SoloBizKit</title><meta name="description" content="Add a text watermark to every page of a PDF. Choose text, position and opacity. Free, no sign up."><link rel="canonical" href="https://solobizkit.it.com/watermark-pdf/"><link rel="stylesheet" href="/global-shell.css"><link rel="stylesheet" href="/theme-warm-green.css"><link rel="stylesheet" href="/pdf-suite.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><header class="sbk-global-header"><div class="sbk-global-nav"><a class="sbk-global-brand" href="/">SoloBiz<span>Kit</span></a><nav class="sbk-global-links"><a href="/pdf-tools/">PDF Tools</a></nav></div></header><main><section class="pdf-hero"><div class="pdf-wrap"><div class="eyebrow">PDF editor</div><h1>Watermark PDF</h1><p>Add a clear text watermark to every page of your PDF.</p></div></section><section class="pdf-wrap pdf-work"><div class="pdf-panel"><div class="pdf-drop"><div class="pdf-drop-icon">WM</div><h2>Choose a PDF</h2><input id="file" type="file" accept="application/pdf,.pdf" hidden><button class="pdf-btn primary" id="choose">Choose PDF</button></div><div class="pdf-field"><label>Watermark text</label><input id="text" maxlength="60" value="CONFIDENTIAL" placeholder="CONFIDENTIAL"></div><div class="pdf-controls"><div class="pdf-field"><label>Position</label><select id="position"><option value="center">Center</option><option value="top">Top center</option><option value="bottom">Bottom center</option></select></div><div class="pdf-field"><label>Opacity</label><select id="opacity"><option value="0.12">Light</option><option value="0.22" selected>Medium</option><option value="0.35">Strong</option></select></div></div><button class="pdf-btn primary" id="run" disabled>Add watermark</button><div class="pdf-status" id="status">Choose a PDF to begin.</div></div><aside class="pdf-panel"><h2>Text watermark</h2><p class="pdf-muted">Useful for draft, confidential, sample and internal documents.</p><div class="pdf-note"><strong>Privacy:</strong> the watermark is applied in your browser.</div></aside></section></main><script>const $=x=>document.getElementById(x),file=$('file'),run=$('run'),status=$('status');let doc=null,name='document.pdf';$('choose').onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>100*1024*1024){status.textContent='File exceeds the 100 MB limit.';return}try{doc=await PDFLib.PDFDocument.load(await f.arrayBuffer());name=f.name;run.disabled=false;status.textContent=f.name+' · '+doc.getPageCount()+' pages'}catch(e){doc=null;run.disabled=true;status.textContent='Could not open this PDF. It may be password-protected or damaged.'}};run.onclick=async()=>{if(!doc)return;const text=$('text').value.trim();if(!text){status.textContent='Enter watermark text first.';return}run.disabled=true;status.textContent='Adding watermark…';try{const font=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold),opacity=+$('opacity').value,pos=$('position').value;doc.getPages().forEach(p=>{const {width,height}=p.getSize(),size=Math.max(20,Math.min(52,width/12)),tw=font.widthOfTextAtSize(text,size);let x=(width-tw)/2,y=(height-size)/2;if(pos==='top')y=height-size-45;if(pos==='bottom')y=45;p.drawText(text,{x:Math.max(18,x),y,size,font,color:PDFLib.rgb(.28,.32,.28),opacity,rotate:pos==='center'?PDFLib.degrees(-25):PDFLib.degrees(0)})});const bytes=await doc.save({useObjectStreams:true}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=name.replace(/\.pdf$/i,'')+'-watermarked.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Done · watermark added to '+doc.getPageCount()+' pages.';window.sbkComplete?.('watermark_pdf',{page_count:doc.getPageCount()})}catch(e){status.textContent='Could not add the watermark.'}finally{run.disabled=!doc}};</script></body></html>
