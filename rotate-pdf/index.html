<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate PDF Pages Free | SoloBizKit</title><meta name="description" content="Rotate all PDF pages 90, 180 or 270 degrees and download a new PDF. Free, no sign up."><link rel="canonical" href="https://solobizkit.it.com/rotate-pdf/"><link rel="stylesheet" href="/global-shell.css"><link rel="stylesheet" href="/theme-warm-green.css"><link rel="stylesheet" href="/pdf-suite.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><header class="sbk-global-header"><div class="sbk-global-nav"><a class="sbk-global-brand" href="/">SoloBiz<span>Kit</span></a><nav class="sbk-global-links"><a href="/pdf-tools/">PDF Tools</a></nav></div></header><main><section class="pdf-hero"><div class="pdf-wrap"><div class="eyebrow">PDF organizer</div><h1>Rotate PDF</h1><p>Rotate every page in a PDF and save a corrected copy.</p></div></section><section class="pdf-wrap pdf-work"><div class="pdf-panel"><div class="pdf-drop"><div class="pdf-drop-icon">↻</div><h2>Choose a PDF</h2><input id="file" type="file" accept="application/pdf,.pdf" hidden><button class="pdf-btn primary" id="choose">Choose PDF</button></div><div class="pdf-field"><label>Rotation</label><select id="angle"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">90° counter-clockwise</option></select></div><button class="pdf-btn primary" id="run" disabled>Rotate PDF</button><div class="pdf-status" id="status">Choose a PDF to begin.</div></div><aside class="pdf-panel"><h2>Simple correction</h2><p class="pdf-muted">This tool rotates all pages while preserving the existing PDF content.</p><div class="pdf-note"><strong>Privacy:</strong> processing runs in your browser.</div></aside></section></main><script>const $=x=>document.getElementById(x),file=$('file'),run=$('run'),status=$('status');let doc=null,name='document.pdf';$('choose').onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>100*1024*1024){status.textContent='File exceeds the 100 MB limit.';return}try{doc=await PDFLib.PDFDocument.load(await f.arrayBuffer());name=f.name;run.disabled=false;status.textContent=f.name+' · '+doc.getPageCount()+' pages'}catch(e){doc=null;run.disabled=true;status.textContent='Could not open this PDF. It may be password-protected or damaged.'}};run.onclick=async()=>{run.disabled=true;status.textContent='Rotating pages…';try{const add=+$('angle').value;doc.getPages().forEach(p=>{const old=p.getRotation().angle||0;p.setRotation(PDFLib.degrees((old+add)%360))});const bytes=await doc.save({useObjectStreams:true}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=name.replace(/\.pdf$/i,'')+'-rotated.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Done · '+doc.getPageCount()+' pages rotated.'}catch(e){status.textContent='Could not rotate this PDF.'}finally{run.disabled=!doc}};</script></body></html>
